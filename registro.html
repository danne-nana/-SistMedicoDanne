<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSystem - Registro y Agenda de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <div class="d-flex" id="wrapper">
        <!-- Menú de navegación lateral -->
        <div class="bg-dark text-white p-3" id="sidebar" style="width: 260px; min-height: 100vh;">
            <h4 class="text-center py-3 border-bottom"><i class="fa-solid fa-stethoscope me-2 text-info"></i>MedSystem</h4>
            <div class="list-group list-group-flush mt-3">
                <a href="dashboard.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="fa-solid fa-chart-line me-2"></i>Inicio</a>
                <a href="registro.html" class="list-group-item list-group-item-action bg-dark text-white active"><i class="fa-solid fa-hospital-user me-2"></i>Pacientes y Citas</a>
                <a href="reportes.html" class="list-group-item list-group-item-action bg-dark text-white"><i class="fa-solid fa-calendar-check me-2"></i>Horarios y Reportes</a>
                <a href="index.html" class="list-group-item list-group-item-action bg-dark text-danger mt-4"><i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar sesión</a>
            </div>
        </div>

        <div class="flex-grow-1 p-4 bg-light">
            <h2 class="mb-4 fw-bold text-dark"><i class="fa-solid fa-calendar-plus text-primary me-2"></i>Gestión de Citas Médicas</h2>
            
            <div class="row g-4">
                <!-- Formulario Extendido -->
                <div class="col-lg-5">
                    <div class="card shadow-sm p-4 border-0 rounded-4">
                        <h5 class="card-title fw-bold mb-3"><i class="fa-solid fa-user-plus me-2 text-primary"></i>Nueva Solicitud</h5>
                        <form id="citaForm">
                            <div class="mb-3">
                                <label for="paciente" class="form-label fw-semibold">Nombre del Paciente</label>
                                <input type="text" id="paciente" class="form-control" required placeholder="Ej: Juan Pérez">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                    <input type="tel" id="telefono" class="form-control" placeholder="+504 9999-9999" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="correo" class="form-label fw-semibold">Correo</label>
                                    <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="especialidad" class="form-label fw-semibold">Especialidad</label>
                                <select id="especialidad" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="General">Medicina General</option>
                                    <option value="Cardiología">Cardiología</option>
                                    <option value="Pediatría">Pediatría</option>
                                    <option value="Dermatología">Dermatología</option>
                                    <option value="Neurología">Neurología</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="medico" class="form-label fw-semibold">Médico Asignado</label>
                                <input type="text" id="medico" class="form-control" required placeholder="Dr. Nombre Apellido">
                            </div>
                            <div class="mb-3">
                                <label for="fecha" class="form-label fw-semibold">Fecha y Hora</label>
                                <input type="datetime-local" id="fecha" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="estado" class="form-label fw-semibold">Estado Inicial</label>
                                <select id="estado" class="form-select" required>
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Confirmada">Confirmada</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm"><i class="fa-solid fa-plus me-1"></i> Guardar Cita</button>
                        </form>
                    </div>
                </div>

                <!-- Tabla Dinámica Ampliada -->
                <div class="col-lg-7">
                    <div class="card shadow-sm p-4 border-0 rounded-4">
                        <h5 class="card-title fw-bold mb-3"><i class="fa-solid fa-list-check me-2 text-primary"></i>Citas Agendadas</h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Paciente / Contacto</th>
                                        <th>Especialidad</th>
                                        <th>Médico</th>
                                        <th>Fecha/Hora</th>
                                        <th>Estado</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCitas">
                                    <!-- Renderizado dinámico -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
