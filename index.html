<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedSystem - Acceso al Sistema</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-body">

    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">
            <!-- Panel Izquierdo: Branding -->
            <div class="col-lg-7 d-none d-lg-flex flex-column justify-content-between p-5 login-hero text-white">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hospital fa-2x"></i>
                    <span class="fs-4 fw-bold">MedSystem Pro</span>
                </div>
                <div class="my-auto max-w-lg">
                    <h1 class="display-4 fw-bold mb-3">Gestión Médica Integral</h1>
                    <p class="lead opacity-75">Plataforma centralizada para el registro de citas, control de pacientes y agendas médicas.</p>
                </div>
                <div class="small opacity-50">© 2026 MedSystem Inc. Todos los derechos reservados.</div>
            </div>

            <!-- Panel Derecho: Formulario de Login -->
            <div class="col-lg-5 d-flex align-items-center justify-content-center bg-white p-4 p-sm-5">
                <div class="w-100 max-w-md">
                    <div class="text-center text-lg-start mb-4">
                        <h2 class="fw-bold text-dark mb-1">Bienvenido de nuevo</h2>
                        <p class="text-muted small">Ingresa tus credenciales para acceder</p>
                    </div>

                    <!-- Alerta de error -->
                    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                    <!-- Formulario con ID correcto -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="usuario" class="form-label fw-semibold"><i class="fa-solid fa-user me-2 text-muted"></i>Usuario</label>
                            <input type="text" class="form-control form-control-lg" id="usuario" placeholder="Ej: admin" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold"><i class="fa-solid fa-lock me-2 text-muted"></i>Contraseña</label>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" id="btnLogin" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mt-3">
                            Iniciar Sesión <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Script principal apuntando a la carpeta js -->
    <script src="js/script.js"></script>
</body>
</html>
